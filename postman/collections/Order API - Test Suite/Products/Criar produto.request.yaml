$kind: http-request
name: Criar produto
url: "{{baseUrl}}/products"
method: POST
body:
  type: json
  content: "{\r

    \  \"name\": \"Teclado Mecânico Gamer\",\r

    \  \"description\": \"Teclado mecânico RGB switch blue\",\r

    \  \"price\": 250.00,\r

    \  \"availableStock\": 10,\r

    \  \"sku\": \"TEC-RGB-01-{{$timestamp}}\"\r

    }"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "var jsonData = pm.response.json();\r

      pm.environment.set(\"productId\", jsonData.id);"
    language: text/javascript
order: 1000
